# Run from this folder: docker compose up -d --build
services:
  mcp:
    build: ..
    env_file: .env
    volumes:
      - mcp-data:/data
    restart: unless-stopped
    # No ports: only Caddy can reach it.

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  mcp-data:
  caddy-data:
